[project]
name = "tetris-coach"
version = "0.1.0"
description = "Game-agnostic Tetris training overlay: watches any on-screen Tetris board and visually suggests the optimal placement"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "mss>=9.0",
    "PySide6>=6.6; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "Pillow>=10.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
tetris-coach = "tetris_coach.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_coach"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/tetris_coach/core", "src/tetris_coach/solver"]
